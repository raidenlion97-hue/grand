
<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRAND BET PREMIUM VIP</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.marquee{background:#111;border-bottom:1px solid #b88a1a;color:#f3d27a;padding:12px;white-space:nowrap;overflow:hidden}
.marquee div{display:inline-block;padding-left:100%;animation:m 18s linear infinite}
@keyframes m{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.hero{height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:1s}
.active{opacity:1}
.overlay{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.8))}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
h1{font-size:min(16vw,120px);margin:0;color:#f0c85d;text-shadow:0 0 25px #b88a1a}
.logo{font-size:70px;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.btns{display:flex;gap:15px;flex-wrap:wrap;margin-top:25px}
.btn{padding:18px 34px;border-radius:18px;text-decoration:none;color:#fff;
background:rgba(255,255,255,.15);backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.25);box-shadow:0 0 25px rgba(240,200,93,.25)}
.goldline{position:fixed;inset:0;border:3px solid rgba(240,200,93,.4);pointer-events:none;box-shadow:0 0 30px rgba(240,200,93,.4)}
</style></head>
<body>
<div class="goldline"></div>
<div class="marquee"><div>💰 ฝากสำเร็จ 50,000 K • 💰 ฝากสำเร็จ 128,000 K • 💰 ฝากสำเร็จ 2,500,000 K • 👑 VIP ถอนสำเร็จ 980,000 K • ติดต่อได้ตลอด 24 ชั่วโมง</div></div>

<section class="hero">
<div class="slide active" style="background-image:url('slide1.jpg')"></div>
<div class="slide" style="background-image:url('slide2.webp')"></div>
<div class="slide" style="background-image:url('slide3.jpg')"></div>
<div class="overlay"></div>

<div class="content">
<div class="logo">👑</div>
<h1>GRAND BET</h1>
<p>PREMIUM CASINO VIP</p>
<div class="btns">
<a class="btn" href="#">WhatsApp</a>
<a class="btn" href="#">Line</a>
<a class="btn" href="#">Messenger</a>
</div>
</div>
</section>

<script>
const s=document.querySelectorAll('.slide');let i=0;
setInterval(()=>{s[i].classList.remove('active');i=(i+1)%s.length;s[i].classList.add('active');},3000);
</script>
</body></html>
